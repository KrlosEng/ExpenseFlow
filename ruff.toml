# Configuración de ruff (lint)
line-length = 130
target-version = "py310"
extend-exclude = [".taste-skill"]

[lint]
# E/W: estilo · F: errores reales (nombres sin definir, imports sin usar) · I: orden de imports
# B: errores frecuentes · UP: sintaxis moderna de Python
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "B008",   # Depends()/Query() como valor por defecto es el patrón de FastAPI
    "B904",   # raise HTTPException dentro de except: el error original no aporta al cliente
]

[lint.per-file-ignores]
# Las pruebas fijan DB_PATH antes de importar la app, a propósito
"backend/test_api.py" = ["E402"]

[lint.isort]
known-first-party = ["app", "auth", "database", "backend"]
